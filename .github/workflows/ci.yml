name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Servir l'appli
        run: |
          nohup python3 -m http.server 8099 >/dev/null 2>&1 &
          sleep 2
      - name: Test de bout en bout
        run: |
          node tests/ocr.test.mjs
          node tests/catalog.test.mjs
          node tests/e2e.js
